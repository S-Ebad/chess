name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # The default GCC (13) on ubuntu-24.04 is missing parts of C++23
    # (<print>, deducing this, ...), so build with GCC 14.
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler and raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build
